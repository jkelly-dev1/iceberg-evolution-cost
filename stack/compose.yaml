# Iceberg + Trino on one machine. Three services, no cloud account.
#
# The credentials below are local-only and deliberate. MinIO needs a root user
# to start, the REST catalog and Trino need the same pair to reach it, and the
# whole stack is bound to loopback. They are fixtures, not secrets.
#
# The project name is explicit, and it has to be. Compose derives the project
# name from the CONTAINING DIRECTORY when you do not set one, and this file
# lives in a directory called stack/. Any other project whose compose file also
# sits in a stack/ directory therefore shares this project namespace, and a
# `docker compose down` run over there removes the containers over here, and
# any unnamed volume goes with them.
name: iceberg-evolution-cost

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: iec-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: iceberg-local
      MINIO_ROOT_PASSWORD: iceberg-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One shot: create the warehouse bucket, then exit 0.
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: iec-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 iceberg-local iceberg-local-secret &&
      mc mb --ignore-existing local/warehouse &&
      echo 'warehouse bucket ready'"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.0
    container_name: iec-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: iceberg-local
      AWS_SECRET_ACCESS_KEY: iceberg-local-secret
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:8181:8181"

  trino:
    image: trinodb/trino:478
    container_name: iec-trino
    depends_on:
      - iceberg-rest
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
